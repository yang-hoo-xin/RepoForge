name: rag-agent-service

x-service: &service
  image: ${SERVICE_IMAGE:-rag-agent-service:local}
  build:
    context: ../..
    dockerfile: deployment/service/Dockerfile
  read_only: true
  tmpfs:
    - /tmp:size=256m
  volumes:
    - service-data:/work
  environment: &environment
    SERVICE_REDIS_URL: redis://:${SERVICE_REDIS_PASSWORD:?Set SERVICE_REDIS_PASSWORD}@redis:6379/0
    SERVICE_NAMESPACE: ${SERVICE_NAMESPACE:-agent-service}
    SERVICE_SETTINGS: /work/corpus/settings.yaml
    SERVICE_WORK_ROOT: /work/jobs
    SERVICE_REQUESTS_PER_MINUTE: ${SERVICE_REQUESTS_PER_MINUTE:-120}
    SERVICE_MAX_PENDING: ${SERVICE_MAX_PENDING:-1000}
    SERVICE_CAPACITY_BYTES: ${SERVICE_CAPACITY_BYTES:-67108864}
    SERVICE_CACHE_CAPACITY_BYTES: ${SERVICE_CACHE_CAPACITY_BYTES:-16777216}
    SERVICE_MAX_JOB_SECONDS: ${SERVICE_MAX_JOB_SECONDS:-600}
  networks: [backend]

services:
  redis:
    image: redis:7.4-alpine
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\" --maxmemory \"$$REDIS_MAXMEMORY\" --maxmemory-policy noeviction"]
    environment:
      REDIS_PASSWORD: ${SERVICE_REDIS_PASSWORD:?Set SERVICE_REDIS_PASSWORD}
      REDIS_MAXMEMORY: ${SERVICE_REDIS_MAXMEMORY:-134217728}
    ports: ["127.0.0.1:${SERVICE_REDIS_PORT:-16379}:6379"]
    volumes: [redis-data:/data]
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping | grep -q PONG"]
      interval: 3s
      timeout: 2s
      retries: 20
    networks: [backend]
    mem_limit: 256m

  prepare:
    <<: *service
    command: ["python", "-B", "scripts/service_load/prepare_demo.py", "--output-root", "/work/corpus"]

  api:
    <<: *service
    environment:
      <<: *environment
      SERVICE_API_TOKEN: ${SERVICE_API_TOKEN:?Set SERVICE_API_TOKEN}
    ports: ["127.0.0.1:${SERVICE_HTTP_PORT:-8080}:8000"]
    depends_on:
      redis: {condition: service_healthy}
      prepare: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 768m

  worker:
    <<: *service
    command: ["python", "-B", "-m", "src.service_layer.worker"]
    environment:
      <<: *environment
      # Scope: worker execution only. 为什么要有它：回退开关不改变API、语料初始化、配额或队列合同。
      SERVICE_QUERY_EXECUTION_MODE: ${SERVICE_QUERY_EXECUTION_MODE:-resident_sparse}
    depends_on:
      redis: {condition: service_healthy}
      prepare: {condition: service_completed_successfully}
    mem_limit: 1536m
    # Scope: worker container hard-stop budget, not a promise of graceful completion. 为什么要有它：子进程清理、租约等待和Redis断连的叠加路径不能声称15秒内可靠结束。
    stop_grace_period: 45s

  prometheus:
    image: prom/prometheus:v3.2.1
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus", "--storage.tsdb.retention.time=3d"]
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports: ["127.0.0.1:${SERVICE_PROMETHEUS_PORT:-9095}:9090"]
    networks: [backend]
    mem_limit: 256m

volumes:
  service-data:
  redis-data:
  prometheus-data:

networks:
  backend:
