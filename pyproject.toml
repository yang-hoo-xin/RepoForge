[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "repoforge"
version = "0.1.0"
description = "RepoForge: evaluation and execution for evidence-grounded coding agents"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "yang-hoo-xin" }
]
keywords = ["repoforge", "coding-agent", "evaluation", "local-llm", "langgraph", "csharp", "evidence-rag"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "pyyaml>=6.0",
    "langgraph>=0.2.0",
    "langchain-text-splitters>=0.3.0",
    "chromadb>=0.4.0",
    "mcp>=1.0.0,<2.0.0",
    "jieba>=0.42",
    "jsonschema>=4.26,<5",
    "markitdown[pdf]>=0.1.0",
    "pymupdf>=1.24.0",
    "streamlit>=1.39.0",
    "ragas>=0.4,<0.5",
    "referencing>=0.37,<1",
    "datasets>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/yang-hoo-xin/RepoForge"
Documentation = "https://github.com/yang-hoo-xin/RepoForge/blob/main/docs/README.md"
Repository = "https://github.com/yang-hoo-xin/RepoForge"
Issues = "https://github.com/yang-hoo-xin/RepoForge/issues"

[project.optional-dependencies]
service = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "redis>=5,<7",
    "prometheus-client>=0.21,<1",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-asyncio>=0.21",
    "pytest-mock>=3.14",
    "pytest-xdist==3.8.0",
    "ruff>=0.1.0",
    "mypy>=1.0",
    "openai>=1.0",
]

[tool.uv]
constraint-dependencies = [
    # Remove when Ragas no longer imports the removed VertexAI shim (#2745/#2753).
    "langchain-community<0.4.2",
    # Remove if Python 3.10 support ends or newer ONNX Runtime restores cp310 wheels.
    "onnxruntime<1.24; python_version < '3.11'",
]

[project.scripts]
mod-agent = "src.mod_agent.cli:main"
mcp-server = "src.mcp_server.server:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "unit: Unit tests (fast, no external dependencies)",
    "integration: Integration tests (may require external services)",
    "e2e: End-to-end tests (full system tests)",
    "llm: marks tests that require real LLM API calls (deselect with '-m \"not llm\"')",
    "slow: Slow tests that should be run less frequently",
]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.hatch.build.targets.wheel]
packages = ["src"]
